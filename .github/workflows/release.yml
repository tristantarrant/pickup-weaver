name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git \
            libasound2-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxcursor-dev libxext-dev libxrandr-dev

      - name: Configure
        run: cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build plugin/build -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist
          tar -C plugin/build/bin -cJf \
            "dist/pickup-weaver-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.xz" .

      - uses: actions/upload-artifact@v4
        with:
          name: pickup-weaver-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: dist/*.tar.xz
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.xz
